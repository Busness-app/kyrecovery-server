# Early warning, not a merge gate: it builds and tests this consumer against the
# ky-primitives default branch via a go.mod replace, answering "the next time we bump
# ky-primitives, will it break us?". Scheduled and manual only -- a failure here is caused
# by a change in another repository, so it never blocks a pull request.
name: ky-primitives compatibility (early warning)

on:
  schedule:
    - cron: '51 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compat:
    name: Build against ky-primitives default branch
    runs-on: ubuntu-latest
    steps:
      # Both checkouts use persist-credentials: false -- nothing after this runs git
      # against a remote, so leaving an auth header in .git/config would only widen what
      # the build and test steps below can read. ky-primitives is public, so this workflow
      # needs and references no repository secret.
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          path: consumer
          persist-credentials: false

      - name: Check out ky-primitives default branch
        uses: actions/checkout@v7
        with:
          repository: Busness-app/ky-primitives
          path: ky-primitives
          persist-credentials: false

      # cache: false. setup-go's post-step would save caches written by an unreviewed
      # default branch of another repository into the scope ci.yml's merge gates restore
      # from. This job runs once a day and can build cold.
      - uses: actions/setup-go@v7
        with:
          go-version-file: consumer/go.mod
          cache: false

      - name: Point this repository at that checkout
        working-directory: consumer
        run: go mod edit -replace github.com/Busness-app/ky-primitives=../ky-primitives

      - name: Build
        working-directory: consumer
        run: go build ./...

      - name: Test
        working-directory: consumer
        run: go test -count=1 ./...

      - name: Explain the failure
        if: failure()
        run: |
          echo "::error::EARLY WARNING, NOT A MERGE GATE. Your pull request did not cause this. kyrecovery-server no longer builds or tests against the ky-primitives default branch, so the next version bump will break it. Fix it here, or in ky-primitives, before that bump -- no branch in this repository is blocked in the meantime."
